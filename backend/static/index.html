<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentLetter Compact</title>
<style>
  :root {
    --brand:#E8453C; --brand-dark:#D13A32;
    --ink:#1F2328; --soft:#5B6470; --faint:#9AA1AB;
    --line:#E5E7EB; --bg:#FFFFFF; --field:#F1F3F6; --card:#FFFFFF;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    line-height:1.6; padding:28px 24px 60px;
  }
  .wrap{max-width:1180px;margin:0 auto}

  /* 헤더 */
  .brand{display:flex;align-items:center;gap:12px}
  .brand .ico{font-size:30px}
  .brand h1{margin:0;font-size:31px;font-weight:700;letter-spacing:-.5px}
  .flow{margin:6px 0 26px;font-size:13px;color:var(--faint)}

  /* 카드 */
  .grid{display:grid;grid-template-columns:1fr 1.12fr;gap:20px;align-items:start}
  .panel{border:1px solid var(--line);border-radius:10px;padding:20px 22px;background:var(--card)}
  .panel h2{margin:0 0 14px;font-size:16.5px;font-weight:700}
  label{display:block;font-size:14px;margin-bottom:8px}
  textarea,select{
    width:100%;border:1px solid var(--line);border-radius:8px;background:var(--field);
    padding:11px 13px;font-size:14px;font-family:inherit;color:var(--ink);
  }
  textarea{resize:vertical;min-height:96px}
  textarea::placeholder{color:#A8AEB8}
  textarea:focus,select:focus{outline:2px solid rgba(232,69,60,.25);border-color:var(--brand)}
  select{height:44px}

  .btn{
    border:none;border-radius:8px;padding:12px 18px;font-size:14.5px;font-weight:600;
    font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;
    justify-content:center;gap:7px;
  }
  .btn-primary{background:var(--brand);color:#fff;width:100%;margin-top:16px;padding:14px}
  .btn-primary:hover{background:var(--brand-dark)}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn-ghost:hover{background:#FAFAFB}
  .btn-approve{background:var(--brand);color:#fff}
  .btn-approve:hover{background:var(--brand-dark)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .actions{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin-top:16px}
  .freq{min-width:120px}
  .freq label{font-size:14px;margin-bottom:8px}

  /* 결과 카드 */
  .result{margin-top:20px;border:1px solid var(--line);border-radius:10px;padding:20px 22px}
  .result h2{margin:0 0 4px;font-size:16.5px;font-weight:700}
  .result .hint{font-size:13.5px;color:var(--faint);margin:0 0 18px}
  .item{border:1px solid var(--line);border-radius:9px;padding:16px 18px;margin-bottom:12px}
  .item .t{font-size:15.5px;font-weight:700;margin-bottom:6px}
  .item .s{font-size:14px;color:var(--soft);margin-bottom:10px}
  .item .m{font-size:12.5px;color:var(--faint)}
  .item.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}

  details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
  summary{cursor:pointer;font-size:13.5px;color:var(--soft);font-weight:600}
  .body{margin-top:14px;font-size:14.5px}
  .body h1{font-size:18px;margin:0 0 12px}
  .body a{color:var(--brand)}
  .audit{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0;font-size:13px;color:var(--soft)}
  .audit b{color:var(--ink)}
  .comment{font-size:13px;color:var(--soft);background:#FAFAFB;border-radius:8px;padding:12px 14px}
  .srcs{margin-top:14px;font-size:13px}
  .srcs a{color:var(--ink);text-decoration:none}
  .srcs a:hover{text-decoration:underline}
  .srcs .n{color:var(--brand);font-weight:700}
  .srcs .from{color:var(--faint)}
  .srcs div{margin-bottom:7px}

  .foot{margin-top:26px;font-size:13px;color:var(--faint)}
  .status{margin-top:14px;font-size:13.5px;min-height:20px}
  .status.err{color:var(--brand)}
  .status.ok{color:#2C7256}
  .spin{
    display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.45);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:900px){
    .grid{grid-template-columns:1fr}
    .actions{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand"><span class="ico">📰</span><h1>AgentLetter Compact</h1></div>
  <div class="flow">Research → Writer → Reviewer → ⏸ Human Approval → Send</div>

  <div class="grid">

    <!-- ① 뉴스레터 요청 -->
    <div class="panel">
      <h2>① 뉴스레터 요청</h2>
      <label>원하는 뉴스레터 내용을 입력하세요.</label>
      <textarea id="req" placeholder="예: 생성형 AI와 LangGraph의 이번 주 주요 뉴스를 실무자 관점에서 5개 정도 정리해 주세요."></textarea>
      <button class="btn btn-primary" id="btnReq">🚀 뉴스레터 요청</button>
      <div class="status" id="st1"></div>
    </div>

    <!-- ② 수정 / 승인 -->
    <div class="panel">
      <h2>② 마음에 안 들 경우 — 수정 요청</h2>
      <label>수정/승인 대상 뉴스</label>
      <select id="target"><option value="">— 아직 생성된 뉴스레터가 없습니다 —</option></select>

      <div style="margin-top:16px">
        <label>이렇게 바꾸어주세요</label>
        <textarea id="dir" placeholder="예: 너무 기술적인 표현은 줄이고, 핵심 뉴스 5개를 먼저 보여준 뒤 각 항목을 실무자가 이해하기 쉽게 설명해 주세요."></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="btnRev" disabled>↺ 수정 요청</button>
        <button class="btn btn-approve" id="btnApp" disabled>✅ 최종 승인</button>
        <div class="freq">
          <label>주기</label>
          <select id="freq">
            <option value="daily">매일</option>
            <option value="weekly">매주</option>
            <option value="biweekly">격주</option>
            <option value="monthly">매월</option>
            <option value="once">한 번만</option>
          </select>
        </div>
      </div>
      <div class="status" id="st2"></div>
    </div>

  </div>

  <!-- ③ 결과 -->
  <div class="result">
    <h2>③ 선택했던 뉴스들의 헤드 내용</h2>
    <p class="hint">선택한 뉴스의 제목과 핵심 요약만 compact하게 보여줍니다.</p>
    <div id="list"></div>
  </div>

  <div class="foot" id="foot">백엔드 연결 확인 중…</div>
</div>

<script>
const API = location.origin;      // 백엔드가 이 화면을 함께 제공하므로 같은 주소
let drafts = [];                  // 만들어진 요약본들
let currentId = null;

const $ = id => document.getElementById(id);
const FREQ = {daily:"매일", weekly:"매주", biweekly:"격주", monthly:"매월", once:"한 번만"};
const STATUS = {pending:"승인 대기", approved:"승인됨", sent:"발송 완료", rejected:"거절됨"};

async function post(path, body) {
  const r = await fetch(API + path, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || "요청에 실패했습니다.");
  return data;
}

function busy(btn, on, label) {
  btn.disabled = on;
  btn.innerHTML = on ? '<span class="spin"></span> ' + label : btn.dataset.label;
}

function say(el, msg, kind) {
  el.textContent = msg;
  el.className = "status" + (kind ? " " + kind : "");
}

function upsert(d) {
  const i = drafts.findIndex(x => x.id === d.id);
  if (i >= 0) drafts[i] = d; else drafts.unshift(d);
  currentId = d.id;
  render();
}

function render() {
  // 드롭다운
  const sel = $("target");
  if (!drafts.length) {
    sel.innerHTML = '<option value="">— 아직 생성된 뉴스레터가 없습니다 —</option>';
  } else {
    sel.innerHTML = drafts.map(d =>
      `<option value="${d.id}" ${d.id === currentId ? "selected" : ""}>${d.title}</option>`
    ).join("");
  }
  const cur = drafts.find(d => d.id === currentId);
  const editable = cur && cur.status === "pending";
  $("btnRev").disabled = !editable;
  $("btnApp").disabled = !editable;

  // 카드 목록
  $("list").innerHTML = drafts.length ? drafts.map(d => {
    const meta = [
      `검수 ${d.score}점`,
      STATUS[d.status] || d.status,
      d.frequency_label ? `주기 ${d.frequency_label}` : null,
      d.created_at
    ].filter(Boolean).join(" · ");

    const a = d.audit_report || {};
    const srcs = (d.sources || []).map((s, i) =>
      `<div><span class="n">[${i+1}]</span>
        <a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>
        <span class="from">(${s.summary || s.domain || ""})</span></div>`).join("");

    return `<div class="item ${d.id === currentId ? "sel" : ""}" onclick="pick('${d.id}')">
      <div class="t">${d.title}</div>
      <div class="s">${d.summary || ""}</div>
      <div class="m">${meta}</div>
      <details onclick="event.stopPropagation()">
        <summary>선택 뉴스의 상세 내용 / 검수 결과</summary>
        <div class="audit">
          <span>가독성 <b>${a.readability ?? "-"}</b></span>
          <span>사실 정확도 <b>${a.fact_accuracy ?? "-"}</b></span>
          <span>일관성 <b>${a.coherence ?? "-"}</b></span>
          <span>수정 <b>${d.revision_count ?? 0}회</b></span>
        </div>
        ${a.reviewer_comment ? `<div class="comment">${a.reviewer_comment}</div>` : ""}
        <div class="body">${d.article_html || ""}</div>
        ${srcs ? `<div class="srcs">${srcs}</div>` : ""}
      </details>
    </div>`;
  }).join("") : '<div class="m" style="color:#9AA1AB">아직 없습니다. ① 에서 요청해 보세요.</div>';
}

function pick(id) { currentId = id; render(); }

// ① 요청
$("btnReq").dataset.label = "🚀 뉴스레터 요청";
$("btnReq").onclick = async () => {
  const text = $("req").value.trim();
  if (!text) { say($("st1"), "원하는 내용을 입력해 주세요.", "err"); return; }
  busy($("btnReq"), true, "만드는 중… (10~20초)");
  say($("st1"), "뉴스를 찾아 요약하고 검수하는 중입니다.");
  try {
    upsert(await post("/api/newsletter/request", {request_text: text}));
    say($("st1"), "완성됐습니다. 아래에서 확인하고 ② 에서 승인해 주세요.", "ok");
  } catch (e) {
    say($("st1"), e.message, "err");
  }
  busy($("btnReq"), false);
};

// ② 수정
$("btnRev").dataset.label = "↺ 수정 요청";
$("btnRev").onclick = async () => {
  const dir = $("dir").value.trim();
  if (!dir) { say($("st2"), "어떻게 바꿀지 적어 주세요.", "err"); return; }
  busy($("btnRev"), true, "다시 쓰는 중…");
  try {
    upsert(await post(`/api/drafts/${currentId}/revise`, {direction: dir}));
    say($("st2"), "수정했습니다.", "ok");
  } catch (e) {
    say($("st2"), e.message, "err");
  }
  busy($("btnRev"), false);
};

// ③ 승인
$("btnApp").dataset.label = "✅ 최종 승인";
$("btnApp").onclick = async () => {
  busy($("btnApp"), true, "승인 중…");
  try {
    const d = await post(`/api/drafts/${currentId}/approve`, {frequency: $("freq").value});
    upsert(d);
    const r = d.send_result || {};
    if (r.sent) say($("st2"), `승인 후 ${r.count}명에게 발송했습니다.`, "ok");
    else if (r.dry_run) say($("st2"), "승인했습니다. (안전장치가 켜져 있어 실제 발송은 하지 않았습니다)", "ok");
    else say($("st2"), "승인했습니다. 발송은 실패: " + (r.reason || ""), "err");
  } catch (e) {
    say($("st2"), e.message, "err");
  }
  busy($("btnApp"), false);
};

$("target").onchange = e => { currentId = e.target.value; render(); };

// 시작할 때 백엔드 상태와 기존 목록을 가져온다
(async () => {
  try {
    const s = await (await fetch(API + "/api/status")).json();
    const st = s.storage.mode === "mysql" ? "MySQL 저장" : "메모리 저장(서버 끄면 사라짐)";
    $("foot").textContent =
      `백엔드 연결됨 · ${st} · 스케줄러 ${s.scheduler.running ? "동작 중" : "꺼짐"}`;
    const l = await (await fetch(API + "/api/drafts")).json();
    drafts = l.drafts || [];
    if (drafts.length) currentId = drafts[0].id;
  } catch {
    $("foot").textContent = "백엔드에 연결하지 못했습니다. 서버가 켜져 있는지 확인해 주세요.";
  }
  render();
})();
</script>
</body>
</html>
